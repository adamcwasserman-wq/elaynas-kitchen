<!doctype html><meta charset="utf-8"><title>review2</title>
<style>body{margin:8px;font:13px sans-serif;background:#fdf6ea}.g{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px}.c{background:#fff;border-radius:8px;text-align:center;padding:2px}.c img,.c svg{width:100%;height:auto;display:block}.bdg-lid{display:none}</style>
<div class=g id=o></div>
<script type=module>
const A = await import('./js/art.js?v=' + Date.now());
const q = new URLSearchParams(location.search);
document.body.style.setProperty('--n', q.get('n') || 4);
const img = svg => `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + svg + '</svg>')}">`;
const ids = q.get('ids').split(',');
o.innerHTML = ids.map(id => {
  if (id.startsWith('b:')) return `<div class=c>${A.badgeSvg(id.slice(2), 3)}${id}</div>`;
  const f = A.ITEM_ART[id] || A.PRODUCER_ART[id] || A.CUSTOMER_ART[id]; return `<div class=c>${img(f())}${id}</div>`; }).join('');
</script>
